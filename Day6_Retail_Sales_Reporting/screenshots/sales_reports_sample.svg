 <text x="88" y="30" class="bar">MYSQL WORKBENCH · AGGREGATE REPORT</text><text x="28" y="82" class="title">DAY 6 · RETAIL SALES REPORTING</text>
 <rect x="28" y="100" width="1044" height="270" rx="7" fill="#fff" stroke="#cbd3da"/>
 <rect x="28" y="100" width="1044" height="34" rx="7" fill="#e8edf1"/><text x="46" y="123" class="tab">SQL EDITOR / TASK OUTPUT</text>
 <text x="350" y="150" class="comment">-- Sales totals by store</text><text x="350" y="177" class="code">SELECT store_id, COUNT(*) AS order_count,</text><text x="350" y="204" class="code">SUM(total_amount) AS sales_total</text><text x="350" y="231" class="code">FROM sales_order</text><text x="350" y="258" class="code">GROUP BY store_id</text><text x="350" y="285" class="code">ORDER BY sales_total DESC;</text>
 <rect x="28" y="388" width="1044" height="222" rx="7" fill="#fff" stroke="#cbd3da"/>
 <rect x="28" y="388" width="1044" height="34" rx="7" fill="#e8edf1"/><text x="46" y="411" class="tab">RESULT GRID / OUTPUT</text>
 <rect x="36" y="430" width="1028" height="30" fill="#dfe8ef"/>
 <text x="44" y="444" class="head">store_id</text><text x="340" y="444" class="head">order_count</text><text x="650" y="444" class="head">sales_total</text><text x="44" y="471" class="cell">1</text><text x="340" y="471" class="cell">8</text><text x="650" y="471" class="cell">₹18,450.00</text><text x="44" y="498" class="cell">2</text><text x="340" y="498" class="cell">6</text><text x="650" y="498" class="cell">₹12,780.00</text><text x="44" y="525" class="cell">3</text><text x="340" y="525" class="cell">4</text><text x="650" y="525" class="cell">₹8,320.00</text>
