 <rect width="1100" height="650" fill="#f4f6f8"/><rect x="0" y="0" width="1100" height="48" fill="#f1f3f4"/><line x1="0" y1="47.5" x2="1100" y2="47.5" stroke="#c9ced3"/>
 
 <text x="28" y="30" class="bar">MYSQL WORKBENCH · JOIN / SUBQUERY REPORT</text><text x="28" y="82" class="title">DAY 7 · RETAIL RETURNS &amp; REFUNDS</text>
 <rect x="28" y="100" width="1044" height="270" rx="7" fill="#fff" stroke="#cbd3da"/>
 <rect x="28" y="100" width="1044" height="34" rx="7" fill="#e8edf1"/><text x="46" y="123" class="tab">SQL EDITOR / TASK OUTPUT</text>
 <text x="350" y="150" class="comment">-- Customers with completed refunds</text><text x="350" y="177" class="code">SELECT c.customer_name, r.refund_status,</text><text x="350" y="204" class="code">SUM(r.refund_amount) AS total_refund</text><text x="350" y="231" class="code">FROM customer c</text><text x="350" y="258" class="code">JOIN sales_order o ON o.customer_id = c.customer_id</text><text x="350" y="285" class="code">JOIN refund r ON r.order_id = o.order_id</text><text x="350" y="312" class="code">GROUP BY c.customer_id, c.customer_name, r.refund_status;</text>
 <rect x="28" y="388" width="1044" height="222" rx="7" fill="#fff" stroke="#cbd3da"/>
 <rect x="28" y="388" width="1044" height="34" rx="7" fill="#e8edf1"/><text x="46" y="411" class="tab">RESULT GRID / OUTPUT</text>
 <rect x="36" y="430" width="1028" height="30" fill="#dfe8ef"/>
 <text x="44" y="444" class="head">customer_name</text><text x="340" y="444" class="head">refund_status</text><text x="650" y="444" class="head">total_refund</text><text x="44" y="471" class="cell">Priya</text><text x="340" y="471" class="cell">COMPLETED</text><text x="650" y="471" class="cell">₹1,250.00</text><text x="44" y="498" class="cell">Anjali</text><text x="340" y="498" class="cell">COMPLETED</text><text x="650" y="498" class="cell">₹780.00</text><text x="44" y="525" class="cell">Divya</text><text x="340" y="525" class="cell">PENDING</text><text x="650" y="525" class="cell">₹450.00</text>
